# ==============================================================================
# Produtos API - Configuração de perfis
# ==============================================================================

# ── Perfil DEV: SQL Server local via Docker ────────────────────────────────────
%dev.quarkus.datasource.db-kind=mssql
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=SenhaForte123!
%dev.quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=produtosdb;encrypt=false;trustServerCertificate=true
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.log.sql=true

# ── Perfil PROD: Azure SQL Database (variáveis injetadas pelo Functions runtime) ──
%prod.quarkus.datasource.db-kind=mssql
%prod.quarkus.datasource.username=${AZURE_SQL_USER}
%prod.quarkus.datasource.password=${AZURE_SQL_PASSWORD}
%prod.quarkus.datasource.jdbc.url=${AZURE_SQL_URL}
%prod.quarkus.hibernate-orm.database.generation=update

# ── Perfil TEST: H2 em memória para testes rápidos ────────────────────────────
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=false

# ── Configuração HTTP / Rotas ──────────────────────────────────────────────────
# Prefixo /api para as rotas REST
quarkus.http.root-path=/

# ── Health checks ──────────────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/api/health

# ── Azure Functions HTTP ───────────────────────────────────────────────────────
# A função HTTP exposta na rota /api/* roteia para o runtime Quarkus
quarkus.azure-functions.app-name=${FUNC_APP_NAME:produtos-api-local}
quarkus.azure-functions.region=brazilsouth

# ── Service Bus connection string ──────────────────────────────────────────────
# Dev: namespace gratuito no Azure portal (Azurite não emula Topics)
# Prod: injetado pelo Functions runtime via App Settings
quarkus.azure.servicebus.connection-string=${SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost/;SharedAccessKeyName=dev;SharedAccessKey=dev}

# ── Logging ────────────────────────────────────────────────────────────────────
quarkus.log.level=INFO
quarkus.log.category."br.com.produtos".level=DEBUG
