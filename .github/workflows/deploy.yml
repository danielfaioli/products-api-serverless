name: Build & Deploy — Produtos API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ── Job 1: Testes ─────────────────────────────────────────────────────────────
  test:
    name: Testes Unitários e de Integração
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Executar testes (H2 em memória, sem Azure)
        run: ./mvnw test -B
        env:
          MAVEN_OPTS: "-Xmx1g"

      - name: Upload relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ── Job 2: Deploy (apenas na branch main) ─────────────────────────────────────
  deploy:
    name: Build e Deploy no Azure
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Login no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build — package sem testes
        run: |
          ./mvnw clean package -B -DskipTests \
            -Dquarkus.profile=prod \
            -Dquarkus.azure-functions.app-name=${{ secrets.FUNC_APP_NAME }}
        env:
          MAVEN_OPTS: "-Xmx1g"

      - name: Deploy para Azure Functions
        run: |
          ./mvnw quarkus:deploy -B \
            -Dquarkus.azure-functions.app-name=${{ secrets.FUNC_APP_NAME }} \
            -Dquarkus.profile=prod \
            -DskipTests
        env:
          MAVEN_OPTS: "-Xmx1g"

      - name: Verificar deployment (smoke test)
        run: |
          FUNC_URL="https://${{ secrets.FUNC_APP_NAME }}.azurewebsites.net/api"
          echo "Testando endpoint: $FUNC_URL/health"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$FUNC_URL/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✓ Health check OK (status $STATUS)"
              break
            fi
            echo "Tentativa $i falhou (status $STATUS), aguardando 15s..."
            sleep 15
          done

      - name: Logout do Azure
        if: always()
        run: az logout
